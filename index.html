<body>
<div class="app" id="app">

  <header class="top">
    <button class="icon-btn" id="listBtn" aria-label="내 여정 목록 열기" title="내 여정">
      <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="title-wrap">
      <span class="eyebrow">걸어서 그날까지</span>
      <h1 id="titleText">우리의 서초동 귀환</h1>
    </div>
    <button class="icon-btn accent" id="shareBtn" aria-label="이 여정 공유하기" title="공유하기">
      <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M12 15V4m0 0L8 8m4-4 4 4M5 14v4.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <nav class="chips" id="chips" aria-label="내 여정 목록"></nav>

  <div class="map-wrap" id="mapWrap">
    <div id="map"></div>

    <div class="dday-float">
      <span class="lbl" id="ddayLabel">목표까지</span>
      <div class="num" id="ddayFloat">D-2604</div>
    </div>

    <div class="route-chip" id="routeChip">— km · 도보 —</div>

    <div class="pickbar" id="pickBar" hidden>
      <p id="pickText">지도를 눌러 위치를 정하세요</p>
      <div class="pickbar-btns">
        <button class="mini ghost" id="pickCancel">취소</button>
        <button class="mini" id="pickRetry">다시 찍기</button>
        <button class="mini primary" id="pickOk" disabled>여기로</button>
      </div>
    </div>

    <div class="share-banner" id="shareBanner" hidden>
      <div class="sb-body">
        <b>공유받은 여정을 보고 있어요</b>
        <span id="shareBannerSub">보낸 사람이 그날 걸어온 자리예요</span>
      </div>
      <div class="sb-btns">
        <button class="mini ghost" id="sbMine">내 여정</button>
        <button class="mini primary" id="sbSave">저장</button>
      </div>
    </div>

    <div class="ms-card" id="msCard" hidden role="status">
      <span class="ms-emoji" id="msEmoji">💛</span>
      <div class="ms-text">
        <b id="msTitle">50% 지점</b>
        <p id="msMsg">절반을 넘었어요.</p>
      </div>
      <button class="ms-close" id="msClose" aria-label="닫기">✕</button>
    </div>
  </div>

  <section class="panel">
    <div class="now-row">
      <div class="now-place"><i class="live"></i><span class="t" id="zoneText">종암동에서 출발</span></div>
      <div class="now-right">
        <button type="button" class="mode-pill" id="modePill" aria-label="오늘로 돌아가기">오늘</button>
        <span class="now-date" id="dateText">2026.11.14</span>
      </div>
    </div>

    <div class="bar"><i id="barFill"></i></div>
    <div class="bar-meta">
      <span><b id="pctText">0%</b> 지나왔어요</span>
      <span><b id="walkedText">0 m</b> / <span id="totalText">15.3 km</span></span>
    </div>

    <div class="stats">
      <div class="stat"><b id="statDday">D-2604</b><span>남은 날</span></div>
      <div class="stat"><b id="statWalked">0 m</b><span>걸어온 길</span></div>
      <div class="stat"><b id="statLeft">15.3 km</b><span>남은 길</span></div>
      <div class="stat"><b id="statPace">5.9 m</b><span>오늘의 몫</span></div>
    </div>

    <button class="ms-strip" id="msStrip" aria-label="이정표 보기">
      <span class="dot"></span>
      <span class="ms-strip-text" id="msStripText">다음 이정표 —</span>
      <span class="chev">›</span>
    </button>

    <div class="slider-block">
      <input type="range" id="slider" min="0" max="2604" value="0" step="1" aria-label="날짜 시뮬레이션">
      <div class="ticks"><span id="tick0">시작</span><span id="tick1">—</span><span id="tick2">—</span><span id="tick3">—</span><span>D-DAY</span></div>
    </div>

    <div class="controls">
      <button class="ctrl" data-jump="-1">−1일</button>
      <button class="ctrl" data-jump="1">+1일</button>
      <button class="ctrl" data-jump="100">+100일</button>
      <button class="ctrl" data-jump="365">+1년</button>
      <button class="ctrl play" id="playBtn" aria-label="여정 재생">▶</button>
    </div>
    <div class="footnote" id="footnote">2026.11.14 → 2033.12.31 · 2604일</div>
  </section>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-head">
    <div class="grab"></div>
    <button class="sheet-x" id="sheetClose" type="button" aria-label="닫기">✕</button>
    <h2 id="sheetTitle">내 여정</h2>
    <p id="sheetSub">여정을 골라 걸어 보세요</p>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-foot" id="sheetFoot"></div>
</div>

<div class="toast" id="toast" role="status"></div>

<noscript>
  <div style="position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:#faf6ef;z-index:9999;text-align:center;font-family:sans-serif;line-height:1.7">
    <p><b>걸어서 그날까지</b><br>지도를 보려면 자바스크립트를 켜 주세요.</p>
  </div>
</noscript>

</html>
