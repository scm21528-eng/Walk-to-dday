<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="걸어서 그날까지">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset="0.55" stop-color="#faf2e4"/>
      <stop offset="1" stop-color="#f0e4d1"/>
    </linearGradient>
    <linearGradient id="walk" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#e8763a"/>
      <stop offset="1" stop-color="#d9552f"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.5" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#fff7e9" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff7e9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="0" fill="url(#paper)"/>
  <rect width="512" height="512" fill="url(#warm)"/>

  <!-- 흐릿한 지도 결 -->
  <g fill="none" stroke="#e6d6bd" stroke-width="4" stroke-linecap="round" opacity="0.75">
    <path d="M-10 132 C 110 96, 210 168, 320 130 S 470 92, 530 120"/>
    <path d="M-10 300 C 90 268, 180 322, 280 300 S 430 258, 530 286"/>
    <path d="M120 -10 C 150 90, 108 190, 150 300 S 190 450, 168 530"/>
    <path d="M392 -10 C 366 96, 404 190, 380 300 S 350 440, 372 530"/>
  </g>
  <g fill="none" stroke="#cfe0cf" stroke-width="26" opacity="0.55">
    <path d="M-20 404 C 120 372, 190 424, 300 400 S 470 356, 540 378"/>
  </g>

  <!-- 걷는 길 -->
  <path d="M96 410 C 168 372, 118 314, 186 276 S 286 244, 306 186 S 350 132, 372 118"
        fill="none" stroke="#fffdf9" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M96 410 C 168 372, 118 314, 186 276 S 286 244, 306 186 S 350 132, 372 118"
        fill="none" stroke="#b3a08a" stroke-width="16" stroke-linecap="round"
        stroke-dasharray="0.5 28" opacity="0.95"/>
  <path d="M96 410 C 168 372, 118 314, 186 276 S 286 244, 306 186 S 350 132, 372 118"
        pathLength="100" fill="none" stroke="url(#walk)" stroke-width="19"
        stroke-linecap="round" stroke-dasharray="54 100"/>

  <!-- 출발 -->
  <circle cx="96" cy="410" r="15" fill="#fffdf9"/>
  <circle cx="96" cy="410" r="8" fill="#6d7f6a"/>

  <!-- 지금 여기 -->
  <circle cx="186" cy="276" r="45" fill="#fffdf9" opacity="0.55"/>
  <circle cx="186" cy="276" r="34" fill="#fffdf9" stroke="url(#walk)" stroke-width="13"/>
  <circle cx="186" cy="276" r="10" fill="#d9552f"/>

  <!-- 도착 -->
  <circle cx="372" cy="118" r="44" fill="none" stroke="#d9552f" stroke-width="14" opacity="0.26"/>
  <circle cx="372" cy="118" r="28" fill="#fffdf9" stroke="#d9552f" stroke-width="13"/>
  <circle cx="372" cy="118" r="8" fill="#d9552f"/>
</svg>
